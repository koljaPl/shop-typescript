services:
  # 1. PostgreSQL Datenbank mit Healthcheck
  postgres:
    image: postgres:17-alpine
    container_name: shop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shop
    ports:
      - "5432:5432"
    volumes:
      - shop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop"]
      interval: 3s
      timeout: 3s
      retries: 5

  # 2. Express.js REST API Backend
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: shop-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/shop?schema=public
      JWT_SECRET: super_geheimes_jwt_token_fuer_docker_2026
      FRONTEND_URL: http://localhost:3001
    ports:
      - "5000:5000"

  # 3. Next.js 14 + HeroUI Frontend
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: shop-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3001
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
      INTERNAL_API_URL: http://backend:5000/api/v1
    ports:
      - "3001:3001"

volumes:
  shop_pgdata:
